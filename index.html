<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111a17">
  <meta name="description" content="FoodFlow — планирование питания, список покупок и учёт рациона.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FoodFlow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>FoodFlow — питание под контролем</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">F<span>●</span></span><span>foodflow<small>ПИТАНИЕ БЕЗ РУТИНЫ</small></span></div>
      <button class="top-settings" data-view="settings" aria-label="Настройки">⚙</button>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button class="nav-btn active" data-view="today"><span class="nav-ico">◉</span><span>Сегодня</span></button>
      <button class="nav-btn" data-view="plan"><span class="nav-ico">▦</span><span>Меню</span></button>
      <button class="nav-btn" data-view="shopping"><span class="nav-ico">▤</span><span>Покупки</span></button>
      <button class="nav-btn" data-view="catalog"><span class="nav-ico">⌕</span><span>Продукты</span></button>
      <button class="nav-btn" data-view="settings"><span class="nav-ico">⚙</span><span>Профиль</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
